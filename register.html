<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тіркелу - NovaTech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #0a0a0f;
      color: #f0f0f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: radial-gradient(circle at 80% 30%, rgba(6,214,160,0.12) 0%, transparent 60%);
    }

    .auth-container {
      width: 100%;
      max-width: 480px;
      padding: 24px;
    }

    .auth-card {
      background: #111118;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 32px;
      padding: 48px 40px;
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-size: 28px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 32px;
      display: block;
      color: #f0f0f8;
      text-decoration: none;
    }

    .logo span {
      color: #7c5cfc;
    }

    h2 {
      font-family: 'Syne', sans-serif;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .sub {
      color: #8888aa;
      font-size: 14px;
      margin-bottom: 32px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #8888aa;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      background: #1a1a26;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      color: #f0f0f8;
      transition: all 0.3s;
      outline: none;
    }

    input:focus {
      border-color: #7c5cfc;
      box-shadow: 0 0 0 3px rgba(124,92,252,0.2);
    }

    input.invalid {
      border-color: #f72585;
    }

    .error {
      color: #f72585;
      font-size: 12px;
      margin-top: 6px;
      display: block;
    }

    .btn-register {
      width: 100%;
      padding: 14px;
      background: #7c5cfc;
      border: none;
      border-radius: 40px;
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      font-weight: 600;
      color: white;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 8px;
    }

    .btn-register:hover {
      background: #a78bfa;
      transform: translateY(-2px);
    }

    .login-link {
      text-align: center;
      margin-top: 28px;
      font-size: 14px;
      color: #8888aa;
    }

    .login-link a {
      color: #7c5cfc;
      text-decoration: none;
    }

    .back-link {
      text-align: center;
      margin-top: 20px;
    }

    .back-link a {
      color: #8888aa;
      font-size: 13px;
      text-decoration: none;
    }
  </style>
</head>
<body>
<div class="auth-container">
  <div class="auth-card">
    <a href="index.html" class="logo">Nova<span>Tech</span></a>
    <h2>Тіркелу</h2>
    <p class="sub">Жаңа аккаунт жасау</p>

    <form id="registerForm">
      <div class="form-group">
        <label>Логин</label>
        <input type="text" id="regUsername" placeholder="aidar_tech">
        <span class="error" id="usernameError"></span>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="example@novatech.kz">
        <span class="error" id="emailError"></span>
      </div>

      <div class="form-group">
        <label>Құпия сөз</label>
        <input type="password" id="regPassword" placeholder="кемінде 6 таңба">
        <span class="error" id="passwordError"></span>
      </div>

      <div class="form-group">
        <label>Құпия сөзді қайталаңыз</label>
        <input type="password" id="regConfirmPassword" placeholder="қайта енгізіңіз">
        <span class="error" id="confirmError"></span>
      </div>

      <button type="submit" class="btn-register">Тіркелу</button>
    </form>

    <div class="login-link">
      Аккаунтыңыз бар ма? <a href="auth.html">Кіру</a>
    </div>
    <div class="back-link">
      <a href="index.html">← Басты бетке оралу</a>
    </div>
  </div>
</div>

<script>
  const registerForm = document.getElementById('registerForm');
  const regUsername = document.getElementById('regUsername');
  const regEmail = document.getElementById('regEmail');
  const regPassword = document.getElementById('regPassword');
  const regConfirmPassword = document.getElementById('regConfirmPassword');
  
  const usernameError = document.getElementById('usernameError');
  const emailError = document.getElementById('emailError');
  const passwordError = document.getElementById('passwordError');
  const confirmError = document.getElementById('confirmError');

  function validateForm() {
    let isValid = true;
    
    usernameError.textContent = '';
    emailError.textContent = '';
    passwordError.textContent = '';
    confirmError.textContent = '';
    
    regUsername.classList.remove('invalid');
    regEmail.classList.remove('invalid');
    regPassword.classList.remove('invalid');
    regConfirmPassword.classList.remove('invalid');

    const username = regUsername.value.trim();
    if (!username || username.length < 3) {
      usernameError.textContent = 'Логин кемінде 3 таңба болуы керек';
      regUsername.classList.add('invalid');
      isValid = false;
    }

    const email = regEmail.value.trim();
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!email || !emailRegex.test(email)) {
      emailError.textContent = 'Дұрыс email енгізіңіз';
      regEmail.classList.add('invalid');
      isValid = false;
    }

    const password = regPassword.value.trim();
    if (!password || password.length < 6) {
      passwordError.textContent = 'Құпия сөз кемінде 6 таңба болуы керек';
      regPassword.classList.add('invalid');
      isValid = false;
    }

    const confirm = regConfirmPassword.value.trim();
    if (password !== confirm) {
      confirmError.textContent = 'Құпия сөздер сәйкес келмейді';
      regConfirmPassword.classList.add('invalid');
      isValid = false;
    }

    return isValid;
  }

  function handleRegister(e) {
    e.preventDefault();
    
    if (!validateForm()) return;

    const username = regUsername.value.trim();
    const email = regEmail.value.trim();
    const password = regPassword.value.trim();

    // Бар пайдаланушыларды алу
    const users = JSON.parse(localStorage.getItem('novatech_users') || '[]');

    // Email немесе логин бойынша тексеру
    const userExists = users.some(user => user.email === email || user.username === username);
    
    if (userExists) {
      emailError.textContent = 'Бұл email немесе логин бос емес';
      regEmail.classList.add('invalid');
      regUsername.classList.add('invalid');
      return;
    }

    // Жаңа пайдаланушыны қосу
    users.push({
      username: username,
      email: email,
      password: password,
      createdAt: new Date().toISOString()
    });

    localStorage.setItem('novatech_users', JSON.stringify(users));
    
    // Автоматты түрде кіргізу
    localStorage.setItem('novatech_logged_in', 'true');
    localStorage.setItem('novatech_user', JSON.stringify({
      username: username,
      email: email
    }));

    window.location.href = 'index.html';
  }

  registerForm.addEventListener('submit', handleRegister);
</script>
</body>
</html>
